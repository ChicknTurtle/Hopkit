<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hopkit</title>
<link rel="icon" href="./icon.png" type="image/png">
<meta property="og:title" content="Hopkit">
<meta property="og:description" content="Play Hopkit on chicknturtle.ninja">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chicknturtle.ninja/projects/hopkit/">
<meta property="og:image" content="https://chicknturtle.ninja/assets/thumbnails/hopkit.png">
<meta property="og:image:width" content="1210">
<meta property="og:image:height" content="767">
<meta property="og:image:type" content="image/png">
<meta name="theme-color" content="#0098dc">
<style>
body {
  margin: 0;
  background-color: rgb(0,0,0);
  overflow: hidden;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: block;
  overflow: hidden;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.hidden-input {
  opacity: 0;
  pointer-events: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: block;
  overflow: hidden;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  z-index: -100;
}
.popup-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  background: #00000080;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.popup-overlay.hidden {
  display: none;
}
.popup-box {
  width: min(90vw, 400px);
  height: fit-content;
  background: #222;
  color: #fff;
  padding: 1.5rem;
  text-align: center;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  border-radius: 0.5rem;
}
.popup-title {
  font-family: sans-serif;
  font-size: 1rem;
  margin: 0;
  padding-bottom: 1rem;
}
.popup-text {
  box-sizing: border-box;
  width: 100%;
  height: 6rem;
  padding: 0.5rem;
  margin-bottom: 1rem;
  background: #333;
  color: #fff;
  border: none;
  resize: none;
  border-radius: 0.25rem;
}
.popup-text.hidden {
  display: none;
}
.popup-buttons {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
}
.popup-btn {
  background: #0098dc;
  color: #fff;
  border: none;
  padding: 0.5rem 0.5rem;
  margin: 0;
  cursor: pointer;
  border-radius: 0.25rem;
}
.popup-btn:hover {
  background: #007bb5;
}
</style>
</head>
<body>
<input type="text" id="textInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<input type="file" id="fileInput" class="hidden-input">
<canvas id="gameCanvas"></canvas>
<div id="customPopup" class="popup-overlay hidden">
  <div class="popup-box">
    <p id="customPopupTitle" class="popup-title"></p>
    <textarea id="customPopupText" class="popup-text" readonly></textarea>
    <div id="customPopupButtons" class="popup-buttons"></div>
  </div>
</div>
<script src="code/init.js" type="module"></script>
</body>
</html>
